name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: UjjwalRaj2025
          BRANCH_NAME: output
          UTC_OFFSET: 5.50
          AUTO_PUSH: false

      - name: Push to output branch
        run: |
          cd profile-summary-card-output || exit 0
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add -A
          git commit -m "Generated profile summary cards"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/UjjwalRaj2025/UjjwalRaj2025.git output
